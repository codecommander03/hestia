services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: hestia
      POSTGRES_PASSWORD: hestia 
      POSTGRES_DB: hestia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hestia"]
      interval: 5s
      retries: 10
volumes:
  pgdata: 